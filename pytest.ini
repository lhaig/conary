[pytest]
# Put the repo root and the rebuilt SAS harness on sys.path before any
# conftest is imported: conary_test/__init__.py imports testrunner.
pythonpath = . testharness
python_files = test_*.py *test.py
markers =
    bydefault: testhelp.context tag
    entitlements: testhelp.context tag
    erase: testhelp.context tag
    fileoverlap: testhelp.context tag
    initialcontents: testhelp.context tag
    labelmultiplicity: testhelp.context tag
    localchangeset: testhelp.context tag
    migrate: testhelp.context tag
    performance: testhelp.context tag
    pin: testhelp.context tag
    redirect: testhelp.context tag
    remove: testhelp.context tag
    repair: testhelp.context tag
    rollbacks: testhelp.context tag
    rpm: testhelp.context tag
    splitting: testhelp.context tag
    sysmodel: testhelp.context tag
    sync: testhelp.context tag
    trovescripts: testhelp.context tag
    updateall: testhelp.context tag
